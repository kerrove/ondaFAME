# Сборка и публикация статического экспорта Next.js на GitHub Pages.
#
# Проект живёт на bun.lock, поэтому зависимости ставит Bun. Саму сборку запускает настоящий Node:
# скрипт build вызывает node напрямую (см. package.json и CLAUDE.md) — под `bun run` Bun исполнял бы
# бинарник next внутри себя и падал на завершении процесса.
#
# Статический экспорт включается только здесь, через GITHUB_PAGES=true: постоянно держать
# output: 'export' нельзя, иначе перестанут работать next dev и next start.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменяем идущий деплой, но лишние очереди схлопываем
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # Кеш зависимостей у setup-node НЕ включаем: он умеет только package-lock.json,
      # npm-shrinkwrap.json и yarn.lock, а у проекта bun.lock — на этом workflow и падал.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          # На Pages сайт живёт в подкаталоге /<repo>, без basePath ассеты уедут в корень домена
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Читается в src/constants/site.ts — canonical, sitemap.xml, robots.txt, og:url
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
